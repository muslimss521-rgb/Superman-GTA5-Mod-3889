name: Build Superman

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'Superman.csproj'
      - '.github/workflows/build-trainer.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore Superman.csproj

      - name: Build Superman
        run: msbuild Superman.csproj /p:Configuration=Release /p:RestorePackages=false

      - name: Prepare release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item bin\Release\net48\Superman.dll release\Superman.dll
          Copy-Item scripts\Superman.cs release\Superman.cs

      - name: Upload Superman
        uses: actions/upload-artifact@v4
        with:
          name: Superman-SHVDN3
          path: release/
